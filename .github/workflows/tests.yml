name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint PHP (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis PHP (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # Também gera os tipos de rotas do Wayfinder usados pela checagem de tipos
      - name: Build frontend
        run: npm run build

      - name: Lint and format TS/React
        run: npm run check

      - name: Type check TS (tsc --noEmit)
        run: npm run types:check

      - name: Tests (Pest)
        run: php artisan test

      - name: Tests TS (Vitest)
        run: npm test
        env:
          # O Vitest carrega o vite.config.ts; o plugin do Laravel bloqueia o modo dev em CI
          LARAVEL_BYPASS_ENV_CHECK: 1
